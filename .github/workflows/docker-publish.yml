name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '40 15 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Publish an image for every branch and every PR from a branch of THIS repo, so a pull request can
  # be deployed as a preview. Fork PRs cannot push (their GITHUB_TOKEN is read-only), so they build
  # only. The tag a preview asks for is `pr-<number>` (see the tags below).
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed to post the preview URL back on the pull request (see the last step).
      pull-requests: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry (also on PRs from this repo - see PUSH_IMAGE)
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `pr-<n>` is what the preview ApplicationSet deploys; `main` and `sha-<short>` stay as before.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Comment the preview URL on the PR once the environment answers.
      #
      # The URL is deterministic (`<short>-pr-<n>.dev.projectsincluded.net`), so the only thing worth
      # waiting for is the deployment itself — Argo CD picks the image up from the ApplicationSet.
      # A single marker comment is UPDATED on every push instead of one comment per commit.
      # `ucp` must match the `<short>` prefix in the cluster's ApplicationSet for this repo.
      - name: Comment the preview URL on the PR
        if: env.PUSH_IMAGE == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://ucp-pr-${{ github.event.pull_request.number }}.dev.projectsincluded.net/
          MARKER: '<!-- preview-environment -->'
        run: |
          set -eu
          status="not answering yet"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then
              status="live"
              break
            fi
            sleep 15
          done
          {
            echo "$MARKER"
            echo "### Preview environment"
            echo
            printf '**%s:** %s\n' "$status" "$PREVIEW_URL"
            echo
            echo "image ghcr.io/${GITHUB_REPOSITORY}:pr-${PR} @ ${GITHUB_SHA:0:7}"
          } > /tmp/preview-comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 | jq -r --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -f body="$(cat /tmp/preview-comment.md)" > /dev/null
          else
            gh pr comment "$PR" --body-file /tmp/preview-comment.md > /dev/null
          fi


      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
